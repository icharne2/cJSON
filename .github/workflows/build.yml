name: Build and package cJSON RPM

on:
  push:
    branches: [ "ino_dev" ]
  pull_request:
    branches: [ "ino_dev" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build RPM inside Docker
        run: |
          docker build \
            -f docker/Dockerfile.deploy \
            -t cjson-rpm-builder:latest \
            docker/

      - name: Extract generated RPM
        run: |
          CONTAINER_ID=$(docker create cjson-rpm-builder:latest)
          mkdir -p artifacts
          docker cp $CONTAINER_ID:/app/mycjson.rpm artifacts/
          docker rm $CONTAINER_ID

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjson-rpm
          path: artifacts/*.rpm

