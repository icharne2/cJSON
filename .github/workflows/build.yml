name: Docker-based build of cJSON on ino_dev

on:
  push:
    branches:
      - ino_dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile.build1 \
            -t cjson-builder:latest \
            .

      - name: Extract build artifact
        run: |
          CONTAINER_ID=\$(docker create cjson-builder:latest)
          mkdir -p artifacts
          docker cp \$CONTAINER_ID:/app/build/libcjson.a artifacts/
          docker rm \$CONTAINER_ID

      - name: Upload cJSON artifact
        uses: actions/upload-artifact@v3
        with:
          name: cjson-lib
          path: artifacts/libcjson.a
